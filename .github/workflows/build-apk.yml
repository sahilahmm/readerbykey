name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # jobs ask for more only where they need it

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  APK_NAME: Reader-by-Key.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # for the build attestation
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Read the version
        run: echo "VERSION_NAME=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts # install scripts of dependencies never run

      - name: Check dependencies for known problems
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Copy PDF.js into the app
        run: npm run prepare:web

      - name: Generate the Android project
        run: npx cap add android

      - name: Apply icon, splash and version number
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build and sign the APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../dist

          if [ -n "$KEYSTORE_BASE64" ]; then
            # Your own permanent key: every build can update the previous install.
            ./gradlew --no-daemon assembleRelease
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias reader \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEYSTORE_PASSWORD \
              --out "../dist/$APK_NAME" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "../dist/$APK_NAME"
            # Google Play takes an app bundle (.aab), signed with the same key as the upload key
            ./gradlew --no-daemon bundleRelease
            jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              app/build/outputs/bundle/release/app-release.aab reader
            cp app/build/outputs/bundle/release/app-release.aab "../dist/Reader-by-Key.aab"
            rm -f "$RUNNER_TEMP/release.jks"
            echo release > ../dist/signing.txt
          else
            # No permanent key yet: sign with a throwaway key made for this build. The app is still a
            # normal (non-debuggable) release build, but Android can't update an older install with it.
            ./gradlew --no-daemon assembleRelease
            keytool -genkeypair -alias reader -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=Reader by Key, O=Key by Sah, C=BD" \
              -keystore "$RUNNER_TEMP/temp.jks" -storetype PKCS12 \
              -storepass temporary-build-key -keypass temporary-build-key
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/temp.jks" \
              --ks-key-alias reader \
              --ks-pass pass:temporary-build-key \
              --key-pass pass:temporary-build-key \
              --out "../dist/$APK_NAME" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "../dist/$APK_NAME"
            rm -f "$RUNNER_TEMP/temp.jks"
            echo temporary > ../dist/signing.txt
          fi

      - name: Checksum and signer fingerprint
        run: |
          # software bill of materials (every library inside the app), for the EU Cyber Resilience Act
          npm sbom --sbom-format cyclonedx --omit dev > dist/Reader-by-Key.sbom.cdx.json
          cd dist
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          [ -f Reader-by-Key.aab ] && sha256sum Reader-by-Key.aab > Reader-by-Key.aab.sha256 || true
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK_NAME" | grep -i "SHA-256 digest" | head -1 > signer.txt || true
          cat "$APK_NAME.sha256" signer.txt

      - name: Attest where this APK came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ env.APK_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: Reader-by-Key-apk
          path: dist/
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the only job that can publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: Reader-by-Key-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION_NAME"
          {
            echo "Download **$APK_NAME** below and open it on your Android phone. It installs as **Reader**."
            if [ "$(cat dist/signing.txt)" = "temporary" ]; then
              echo
              echo "> This build is signed with a one-time key (no permanent key is set up yet), so uninstall any older Reader before installing. See the README, \"Permanent signing\"."
            fi
            echo
            cat RELEASE_NOTES.md
            echo
            echo "### Verify this download"
            echo "- SHA-256 of the APK: \`$(cut -d' ' -f1 dist/$APK_NAME.sha256)\`"
            echo "- Signing certificate: \`$(sed 's/.*: //' dist/signer.txt)\`"
            echo "- Software bill of materials: \`Reader-by-Key.sbom.cdx.json\` (CycloneDX)."
            echo "- Built by GitHub Actions from this repository, with a build attestation (\`gh attestation verify $APK_NAME --repo sahilahmm/readerbykey\`)."
          } > "$RUNNER_TEMP/notes.md"

          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release delete latest --cleanup-tag --yes || true   # the old rolling release, if it still exists
          EXTRA=""
          [ -f dist/Reader-by-Key.aab ] && EXTRA="dist/Reader-by-Key.aab dist/Reader-by-Key.aab.sha256"
          gh release create "$TAG" "dist/$APK_NAME" "dist/$APK_NAME.sha256" dist/Reader-by-Key.sbom.cdx.json $EXTRA \
            --title "Reader by Key $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            --latest

  ios:
    # Runs after the Android release exists and adds an iOS build to it. If this job fails,
    # the Android release is not affected.
    needs: release
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read the version
        run: echo "VERSION_NAME=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Copy PDF.js into the app
        run: npm run prepare:web

      - name: Generate the iOS project
        run: npx cap add ios

      - name: Apply icon, launch screen, file types, privacy manifest and version
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node scripts/patch-ios.mjs
          npx cap sync ios

      - name: Build the app (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Reader.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 30
          mkdir -p dist/Payload
          cp -R "$RUNNER_TEMP/Reader.xcarchive/Products/Applications/App.app" dist/Payload/
          (cd dist && zip -qr Reader-by-Key-unsigned.ipa Payload && rm -rf Payload && shasum -a 256 Reader-by-Key-unsigned.ipa > Reader-by-Key-unsigned.ipa.sha256)
          ls -la dist

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION_NAME" dist/Reader-by-Key-unsigned.ipa dist/Reader-by-Key-unsigned.ipa.sha256 --clobber
