<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' blob: data:; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light" />
  <script src="theme.js"></script>
  <title>Reader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <g id="i-gear"><path d="M4 7h8M18 7h2M4 12h2M12 12h8M4 17h9M19 17h1"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="16" cy="17" r="2.2"/></g>
      <g id="i-bin"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></g>
      <g id="i-rotate"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4"/></g>
      <g id="i-vibrate"><rect x="8" y="3.5" width="8" height="17" rx="2"/><path d="M4 8v8M20 8v8"/></g>
      <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
      <g id="i-minus"><path d="M5 12h14"/></g>
      <g id="i-x"><path d="M6 6l12 12M18 6L6 18"/></g>
      <g id="i-check"><path d="M5 12.5l4.5 4.5L19 7"/></g>
      <g id="i-back"><path d="M15 5l-7 7 7 7"/></g>
      <g id="i-share"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></g>
      <g id="i-edit"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1zM14 7l3 3"/></g>
      <g id="i-archive"><rect x="3" y="4" width="18" height="5" rx="2"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></g>
      <g id="i-moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></g>
      <g id="i-pin"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"/></g>
      <g id="i-camera"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></g>
      <g id="i-text"><path d="M4 6h16M4 10h11M4 14h16M4 18h9"/></g>
    </defs>
  </svg>

  <!-- HOME -->
  <main id="home" class="screen">
    <button id="setBtn" class="set" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
    <div id="menu" class="menu" hidden>
      <button id="optVib" class="opt" type="button" role="switch" aria-checked="true" aria-label="Vibration"><svg class="ic" viewBox="0 0 24 24"><use href="#i-vibrate"/><path class="slash" d="M4 4l16 16"/></svg></button>
      <button id="optDark" class="opt" type="button" role="switch" aria-checked="false" aria-label="Dark mode"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg></button>
    </div>
    <div id="hero" class="hero">
      <div class="logo"><svg class="logo-mark" role="img" aria-label="BareBones" viewBox="440 210 660 570" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="46" d="M768 241V749"/><path stroke-width="36" d="M511 248C560 335 640 365 768 342C896 365 976 335 1025 248M470 410C530 500 640 515 768 475C896 515 1006 500 1066 410M470 568C530 655 640 665 768 622C896 665 1006 655 1066 568"/></svg></div>
      <h1 id="greeting"></h1>
      <p id="empty" class="empty">Nothing here yet</p>
    </div>

    <section id="shelf" class="shelf">
      <div id="tools" class="tools">
        <button id="groupChip" class="chip" type="button" hidden>Group: Date</button>
        <span id="viewLabel" class="view-label" hidden></span>
      </div>
      <ul id="list" class="list"></ul>
      <button id="allChip" class="chip" type="button" hidden>Select all</button>
    </section>

    <div id="scanEdit" class="scan-edit" hidden>
      <div id="seStage" class="se-stage"><canvas id="seCanvas"></canvas><svg id="seQuad" class="se-quad"><polygon id="sePoly"/></svg><div id="seHandles"></div></div>
    </div>

    <nav id="dock" class="dock" aria-live="polite">
      <div class="seg" data-s="open"><button id="bOpen" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg><span>Open Document</span></button></div>
      <div class="seg" data-s="add"><button id="bAdd" type="button" aria-label="Open another document"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button></div>
      <div class="seg" data-s="scan"><button id="bScan" type="button" aria-label="Scan a document"><svg class="ic" viewBox="0 0 24 24"><use href="#i-camera"/></svg></button></div>

      <div class="seg" data-s="share"><button id="bShare" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-share"/></svg><span>Share</span></button></div>
      <div class="seg" data-s="archive"><button id="bArchive" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-archive"/></svg><span id="archiveLabel">Archive</span></button></div>
      <div class="seg" data-s="delete"><button id="bDelete" type="button" aria-label="Remove"><svg class="ic" viewBox="0 0 24 24"><use href="#i-bin"/></svg></button></div>

      <div class="seg" data-s="pdf"><button id="bPdf" type="button"><span>PDF</span></button></div>
      <div class="seg" data-s="word"><button id="bWord" type="button"><span>Word</span></button></div>
      <div class="seg" data-s="msg"><div id="dockMsg" class="msg"></div></div>

      <div class="seg" data-s="sthumbs"><div id="scanThumbs" class="thumbs"></div></div>
      <div class="seg" data-s="ecancel"><button id="eCancel" type="button" aria-label="Cancel"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="seg" data-s="erot"><button id="eRot" type="button" aria-label="Rotate"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rotate"/></svg></button></div>
      <div class="seg" data-s="eapply"><button id="eApply" type="button" aria-label="Apply"><svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg></button></div>
      <div class="seg" data-s="sok"><button id="sOk" type="button" aria-label="Finish scan"><svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg></button></div>
      <div class="seg" data-s="sx"><button id="sX" type="button" aria-label="Discard scan"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="seg" data-s="socr"><button id="sOcr" type="button" role="switch" aria-checked="true" aria-label="Recognise text"><span>Aa</span></button></div>
      <div class="seg" data-s="spdf"><button id="sPdf" type="button"><span>PDF</span></button></div>
      <div class="seg" data-s="sword"><button id="sWord" type="button"><span>Word</span></button></div>
      <div class="seg" data-s="undo"><button id="bUndo" type="button">Undo</button></div>
      <div class="seg" data-s="pw"><input id="pwInput" type="password" maxlength="128" enterkeyhint="done" autocomplete="off" placeholder="Password" aria-label="PDF password" /></div>
      <div class="seg" data-s="yes"><button id="bYes" type="button" aria-label="Confirm"><svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg></button></div>
      <div class="seg" data-s="no"><button id="bNo" type="button" aria-label="Cancel"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="seg" data-s="back"><button id="bBack" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg><span>Recent</span></button></div>
    </nav>

    <input id="fileInput" type="file" accept="application/pdf,.pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.presentationml.slideshow,.pptx,.ppsx,text/plain,.txt" hidden />
  </main>

  <!-- READER -->
  <section id="reader" class="screen" hidden>
    <header id="bar" class="bar">
      <button id="backBtn" class="icon" type="button" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <h2 id="title" class="bar-title"></h2>
      <button id="textBtn" class="icon" type="button" aria-label="Read as text" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><use href="#i-text"/></svg></button>
      <button id="nightBtn" class="icon" type="button" aria-label="Night pages" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg></button>
      <button id="zoomOut" class="icon" type="button" aria-label="Smaller"><svg class="ic" viewBox="0 0 24 24"><use href="#i-minus"/></svg></button>
      <button id="zoomIn" class="icon" type="button" aria-label="Larger"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
    </header>

    <div id="scroller" class="scroller"><div id="pages" class="pages"></div></div>
    <article id="textView" class="textview" hidden></article>

    <button id="pill" class="pill" type="button" aria-label="Go to page">1 / 1</button>
  </section>

  <!-- GO TO PAGE -->
  <div id="sheet" class="sheet" hidden>
    <form id="jumpForm" class="sheet-card" autocomplete="off">
      <label for="jumpInput">Go to page</label>
      <div class="sheet-row">
        <input id="jumpInput" type="number" inputmode="numeric" min="1" required />
        <button class="go" type="submit">Go</button>
      </div>
    </form>
  </div>

  <!-- SCANNER (1.5) -->
  <input id="scanCapture" type="file" accept="image/*" capture="environment" hidden />

  <div id="loading" class="loading" hidden>Opening…</div>

  <script type="module" src="app.js"></script>
</body>
</html>
