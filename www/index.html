<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' blob: data:; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light" />
  <script src="theme.js"></script>
  <title>Reader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
      <g id="i-minus"><path d="M5 12h14"/></g>
      <g id="i-x"><path d="M6 6l12 12M18 6L6 18"/></g>
      <g id="i-check"><path d="M5 12.5l4.5 4.5L19 7"/></g>
      <g id="i-back"><path d="M15 5l-7 7 7 7"/></g>
      <g id="i-share"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></g>
      <g id="i-edit"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1zM14 7l3 3"/></g>
      <g id="i-archive"><rect x="3" y="4" width="18" height="5" rx="2"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></g>
      <g id="i-moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></g>
      <g id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></g>
      <g id="i-pin"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"/></g>
      <g id="i-text"><path d="M4 6h16M4 10h11M4 14h16M4 18h9"/></g>
    </defs>
  </svg>

  <!-- HOME -->
  <main id="home" class="screen">
    <h1 id="greeting"></h1>

    <section id="shelf" class="shelf">
      <div id="tools" class="tools">
        <button id="themeBtn" class="chip round" type="button" aria-label="Switch to dark theme"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg></button>
        <button id="allChip" class="chip" type="button" hidden>Select all</button>
        <button id="groupChip" class="chip" type="button" hidden>Group: Date</button>
        <button id="archiveChip" class="chip" type="button" hidden></button>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">Nothing here yet</p>
    </section>

    <nav id="dock" class="dock" aria-live="polite">
      <div class="seg" data-s="open"><button id="bOpen" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg><span>Open Document</span></button></div>
      <div class="seg" data-s="add"><button id="bAdd" type="button" aria-label="Open another document"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button></div>
      <div class="seg" data-s="remove"><button id="bRemove" type="button" aria-label="Remove last file"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>

      <div class="seg" data-s="share"><button id="bShare" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-share"/></svg><span>Share</span></button></div>
      <div class="seg" data-s="rename"><button id="bRename" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-edit"/></svg><span>Rename</span></button></div>
      <div class="seg" data-s="archive"><button id="bArchive" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-archive"/></svg><span id="archiveLabel">Archive</span></button></div>
      <div class="seg" data-s="delete"><button id="bDelete" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg><span>Remove</span></button></div>

      <div class="seg" data-s="pdf"><button id="bPdf" type="button"><span>PDF</span></button></div>
      <div class="seg" data-s="word"><button id="bWord" type="button"><span>Word</span></button></div>

      <div class="seg" data-s="input"><input id="renameInput" type="text" maxlength="80" enterkeyhint="done" autocomplete="off" aria-label="New name" /></div>
      <div class="seg" data-s="msg"><div id="dockMsg" class="msg"></div></div>
      <div class="seg" data-s="undo"><button id="bUndo" type="button">Undo</button></div>
      <div class="seg" data-s="pw"><input id="pwInput" type="password" maxlength="128" enterkeyhint="done" autocomplete="off" placeholder="Password" aria-label="PDF password" /></div>
      <div class="seg" data-s="yes"><button id="bYes" type="button" aria-label="Confirm"><svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg></button></div>
      <div class="seg" data-s="no"><button id="bNo" type="button" aria-label="Cancel"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="seg" data-s="back"><button id="bBack" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg><span>Recent</span></button></div>
    </nav>

    <input id="fileInput" type="file" accept="application/pdf,.pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,text/plain,.txt" hidden />
  </main>

  <!-- READER -->
  <section id="reader" class="screen" hidden>
    <header id="bar" class="bar">
      <button id="backBtn" class="icon" type="button" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <h2 id="title" class="bar-title"></h2>
      <button id="textBtn" class="icon" type="button" aria-label="Read as text" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><use href="#i-text"/></svg></button>
      <button id="nightBtn" class="icon" type="button" aria-label="Night pages" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg></button>
      <button id="zoomOut" class="icon" type="button" aria-label="Smaller"><svg class="ic" viewBox="0 0 24 24"><use href="#i-minus"/></svg></button>
      <button id="zoomIn" class="icon" type="button" aria-label="Larger"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
    </header>

    <div id="scroller" class="scroller"><div id="pages" class="pages"></div></div>
    <article id="textView" class="textview" hidden></article>

    <button id="pill" class="pill" type="button" aria-label="Go to page">1 / 1</button>
  </section>

  <!-- GO TO PAGE -->
  <div id="sheet" class="sheet" hidden>
    <form id="jumpForm" class="sheet-card" autocomplete="off">
      <label for="jumpInput">Go to page</label>
      <div class="sheet-row">
        <input id="jumpInput" type="number" inputmode="numeric" min="1" required />
        <button class="go" type="submit">Go</button>
      </div>
    </form>
  </div>

  <div id="loading" class="loading" hidden>Opening…</div>

  <script type="module" src="app.js"></script>
</body>
</html>
